name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokerorga
          POSTGRES_PASSWORD: pokerorga
          POSTGRES_DB: pokerorga
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pokerorga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pokerorga:pokerorga@localhost:5432/pokerorga
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Tests E2E (Playwright)
        run: npm run test:e2e
      - name: Test de bout en bout de l'API
        run: |
          PORT=3000 NODE_ENV=production node apps/api/dist/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          npm run smoke -w @pokerorga/api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      APP_PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: pokerorga:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrage de la stack docker compose
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy ] && break
            sleep 2
          done
          docker compose ps
          curl -sf http://localhost:8080/api/health
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
      - name: Test de bout en bout de l'API sur le conteneur
        run: node apps/api/scripts/smoke.mjs http://localhost:8080
      - name: Logs des conteneurs
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêt de la stack
        if: always()
        run: docker compose down -v

  publish:
    # publie l'image sur GHCR une fois tous les tests passés (push sur main uniquement)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/huugueau/pokerorga-app
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Publication de l'image sur GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
