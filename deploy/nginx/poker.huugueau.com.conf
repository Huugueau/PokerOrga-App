# /etc/nginx/sites-available/poker.huugueau.com
# Version HTTP seule : `certbot --nginx -d poker.huugueau.com` ajoute ensuite le bloc HTTPS
# et la redirection automatiquement.
# Si APP_PORT a été changé dans .env, adaptez le port 8080 ci-dessous.

server {
    listen 80;
    listen [::]:80;
    server_name poker.huugueau.com;

    # imports de logos / fonds / sons (limite de l'app : 2 Mo par fichier)
    client_max_body_size 5m;

    # flux temps réel (Server-Sent Events) : pas de buffering, connexions longues
    location ~ ^/api/.*/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
