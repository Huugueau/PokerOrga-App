# PokerOrga — déploiement portable : docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokerorga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokerorga}
      POSTGRES_DB: ${POSTGRES_DB:-pokerorga}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokerorga} -d ${POSTGRES_DB:-pokerorga}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: pokerorga:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pokerorga}:${POSTGRES_PASSWORD:-pokerorga}@db:5432/${POSTGRES_DB:-pokerorga}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
